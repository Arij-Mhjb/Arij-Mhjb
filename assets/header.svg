<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arij Mahjoub — Software Engineer and Impact Builder</title>
  <desc id="desc">Creative dark banner with bold typography, woven fiber paths, code symbols and colorful technology badges.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#041A17"/><stop offset="0.46" stop-color="#0B1730"/><stop offset="1" stop-color="#27133A"/>
    </linearGradient>
    <linearGradient id="name" x1="72" y1="80" x2="620" y2="278" gradientUnits="userSpaceOnUse">
