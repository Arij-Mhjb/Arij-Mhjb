<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arij Mahjoub — Software Engineering</title>
  <desc id="desc">A dark emerald and violet banner with woven lines representing technology, sustainability and connected systems.</desc>
  <defs>
    <linearGradient id="background" x1="60" y1="20" x2="1140" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A17"/>
      <stop offset="0.5" stop-color="#10233D"/>
      <stop offset="1" stop-color="#24153C"/>
    </linearGradient>
    <linearGradient id="accent" x1="130" y1="70" x2="1060" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="weave" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M0 11H44M0 33H44" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="2"/>
      <path d="M11 0V44M33 0V44" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#weave)"/>
  <circle cx="1050" cy="64" r="170" fill="#34D399" fill-opacity="0.07"/>
  <circle cx="1120" cy="300" r="220" fill="#A78BFA" fill-opacity="0.07"/>
  <path d="M72 276C222 197 296 321 438 244C580 167 641 275 775 201C909 127 1009 208 1137 115" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <g opacity="0.95">
    <circle cx="72" cy="276" r="7" fill="#34D399"/>
    <circle cx="438" cy="244" r="7" fill="#2DD4BF"/>
    <circle cx="775" cy="201" r="7" fill="#22D3EE"/>
    <circle cx="1137" cy="115" r="7" fill="#A78BFA"/>
  </g>
  <text x="72" y="118" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="750" letter-spacing="-1.5">Arij Mahjoub</text>
  <text x="76" y="166" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="3">SOFTWARE ENGINEERING · TUNISIA</text>
  <text x="76" y="210" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="22">Building useful systems where code, people and sustainability connect.</text>
  <g transform="translate(895 238)">
    <rect width="242" height="54" rx="27" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <circle cx="31" cy="27" r="10" fill="#34D399"/>
    <text x="52" y="35" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">open to collaboration</text>
  </g>
</svg>
